<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Clipboard Saver</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clipboard">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Clipboard Saver</h1>
        <small id="count">0 entries</small>
      </div>
      <button id="install" hidden>Install</button>
    </header>

    <div class="actions">
      <button id="paste">Paste Clipboard</button>
      <button id="export">Export TXT</button>
    </div>

    <input id="search" placeholder="Search history" type="search" autocomplete="off">
    <section id="history"></section>

    <footer>
      <button id="clear">Clear History</button>
      <small>Stored locally on this device</small>
    </footer>
  </main>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
